[project]
name = "self-lamma2-chat-bot"
version = "0.1.0"
description = "Hybrid BM25 + pgvector RAG chatbot powered by Groq GPT-OSS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "uvicorn[standard]>=0.52.1",
]
